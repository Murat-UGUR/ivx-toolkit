name: Release

# Create a tag such as v0.5.0 that matches the package version, either in the GitHub UI
# (Releases > Draft a new release > "Choose a tag" > type v0.5.0 > Publish) or with
# `git tag v0.5.0 && git push origin v0.5.0`. This workflow tests the code, builds the wheel and
# source archive and attaches them to the release (creating it, with the CHANGELOG section as
# notes, if it does not exist yet). 0.x versions are marked as pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x releases are published as pre-releases until the live appliance test is done
          prerelease=""
          case "${GITHUB_REF_NAME}" in v0.*) prerelease="--prerelease" ;; esac
          # Release notes: this version's CHANGELOG section
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # Release drafted in the GitHub UI (which created the tag): just attach the packages
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            if [ -n "$prerelease" ]; then gh release edit "${GITHUB_REF_NAME}" --prerelease; fi
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "ivx-toolkit ${GITHUB_REF_NAME}" \
              --notes-file notes.md $prerelease
          fi
