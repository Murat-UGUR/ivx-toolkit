name: Release

# Create a tag such as v0.4.0 (GitHub: Releases > Draft a new release > "Choose a tag",
# or `git tag v0.4.0 && git push origin v0.4.0`). This workflow tests the code, builds the
# wheel and source archive, and publishes them on a GitHub Release with generated notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x releases are published as pre-releases until the live appliance test is done
          prerelease=""
          case "${GITHUB_REF_NAME}" in v0.*) prerelease="--prerelease" ;; esac
          # Release notes: this version's CHANGELOG section
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ivx-toolkit ${GITHUB_REF_NAME}" \
            --notes-file notes.md $prerelease
