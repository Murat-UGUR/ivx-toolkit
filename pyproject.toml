[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivx-toolkit"
version = "0.5.0"
description = "Command-line toolkit for the Trellix IVX sandbox REST API (wsapis): submit files/URLs, poll status, export reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Murat UĞUR" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["trellix", "ivx", "sandbox", "malware-analysis", "secops", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ivx = "ivx_toolkit.cli:main"
ivx-mock = "ivx_toolkit.mock_server:main"

[project.urls]
Homepage = "https://github.com/Murat-UGUR/ivx-toolkit"
Issues = "https://github.com/Murat-UGUR/ivx-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
